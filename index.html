<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMSA DAT-262 | Cadenas de Markov y Modelos ARIMA sobre GitHub Archive</title>
  <meta name="description" content="Dashboard analítico estocástico del proyecto DAT-262 UMSA: Cadenas de Markov, PageRank y Modelos ARIMA conectado con el dataset 2024-01-15-12.json de GitHub Archive.">

  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- KaTeX CSS for LaTeX math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ghCanvas: '#0d1117',
            ghSurface: '#161b22',
            ghSubtle: '#21262d',
            ghBorder: '#30363d',
            ghText: '#c9d1d9',
            ghMuted: '#8b949e',
            ghSubtleText: '#6e7681',
            ghBlue: '#58a6ff',
            ghBlueEmphasis: '#1f6feb',
            ghGreen: '#3fb950',
            ghGreenEmphasis: '#238636',
            ghPurple: '#bc8cff',
            ghPurpleEmphasis: '#8957e5',
            ghOrange: '#d29922',
            ghRed: '#f85149',
            ghCyan: '#39c5cf',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- GitHub Primer Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-ghCanvas text-ghText antialiased">
  <!-- Network URL (auto-generado por start_dashboard.py) -->
  <script src="network_url.js" onerror="window.NETWORK_URL=window.location.href"></script>
  <div id="root">
    <!-- Fallback loading indicator -->
    <div class="min-h-screen flex items-center justify-center bg-ghCanvas text-ghMuted">
      <div class="flex items-center gap-3">
        <svg class="animate-spin h-5 w-5 text-ghBlue" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="font-mono text-sm">Cargando UMSA DAT-262 Stochastic Dashboard...</span>
      </div>
    </div>
  </div>

  <!-- Load Data Module then App -->
  <script type="module">
    import * as GH_DATA from './data.js';
    window.GH_DATA = GH_DATA;
    window.dispatchEvent(new Event('gh-data-loaded'));
  </script>

  <!-- React Application Component Scripts -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
